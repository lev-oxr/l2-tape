name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked  # Python from .python-version
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q  # offline: recorded fixtures only
